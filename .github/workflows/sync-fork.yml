name: Sync fork with upstream

on:
  schedule:
    - cron: '0 6 * * *'   # tous les jours à 6h UTC
  workflow_dispatch:        # bouton "Run workflow" manuel dans l'onglet Actions

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/razeNFR/proxyivshook.git

      - name: Fetch upstream
        run: git fetch upstream

      - name: Merge upstream into main
        run: |
          git checkout main
          git merge upstream/main --no-edit || {
            echo "::error::Merge conflict — une intervention manuelle est nécessaire (voir l'onglet Actions pour les détails)."
            exit 1
          }

      - name: Push changes
        run: git push origin main
